workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Set up local.properties and debug.keystore
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore
          fi
      - name: Build Android APK
        script: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug
          fi
    artifacts:
      - app/build/outputs/**/*.apk
