name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Decode Fixed Debug Keystore
      run: |
        if [ -f android/app/debug.keystore.base64 ]; then
          base64 -d android/app/debug.keystore.base64 > android/app/debug.keystore
          echo "debug.keystore created."
        fi

    - name: Install Dependencies & Build Web
      run: |
        npm install --legacy-peer-deps
        npm run build
        npx cap sync android

    - name: Verify Icon File
      run: |
        file android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        md5sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

    - name: Build Android Debug APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RoxFollow-App-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
