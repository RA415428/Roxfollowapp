name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Decode Fixed Debug Keystore
      run: |
        if [ -f android/app/debug.keystore.base64 ]; then
          base64 -d android/app/debug.keystore.base64 > android/app/debug.keystore
          echo "debug.keystore created."
        fi

    - name: Install Dependencies & Build Web
      run: |
        npm install --legacy-peer-deps
        npm run build
        npx cap sync android

        # Restore Rox Follow launcher icons AFTER Capacitor sync
        for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          cp resources/icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          cp resources/icon.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          cp resources/icon.png android/app/src/main/res/mipmap-$d/app_icon.png
          cp resources/icon.png android/app/src/main/res/mipmap-$d/app_icon_round.png
          cp resources/icon.png android/app/src/main/res/mipmap-$d/app_icon_foreground.png
        done

    - name: Verify Icon File
      run: |
        file android/app/src/main/res/mipmap-xxxhdpi/app_icon.png
        md5sum android/app/src/main/res/mipmap-xxxhdpi/app_icon.png

    - name: Build Android Debug APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon

    - name: Verify Final APK Icon
      working-directory: android
      run: |
        APK=app/build/outputs/apk/debug/app-debug.apk
        echo "===== APK FILE ====="
        ls -lh "$APK"
        echo "===== APK ICON REFERENCES ====="
        AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
        "$AAPT" dump badging "$APK" | grep -E 'application-icon|application-label'
        echo "===== PACKAGED ICON FILES ====="
        unzip -l "$APK" | grep -E 'mipmap|app_icon|ic_launcher' | head -100
        echo "===== PACKAGED APP ICON HASHES ====="
        unzip -p "$APK" 'res/*/app_icon.png' 2>/dev/null | sha256sum || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RoxFollow-App-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
